[package]
name = "rust-wayback"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs"] }
reqwest = { version = "0.12", features = ["json", "gzip", "brotli", "deflate", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
colored = "2"
indicatif = "0.17"
anyhow = "1"
futures = "0.3"
governor = { version = "0.6", features = ["std"] }
nonzero_ext = "0.3"
url = "2"
ahash = "0.8"
tokio-util = { version = "0.7", features = ["compat"] }
dotenvy = "0.15"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
